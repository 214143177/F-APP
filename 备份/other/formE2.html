<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>

    <body>
        <form id="formE2" class="form">
            <h1>钢管混凝土柱计算</h1>
            <label>
                <select id="r0" name="r0">
                    <option value="">请选择:</option>
                    <option class="option" value="0.9">普通0.9</option>
                    <option class="option" value="1.0">一般1.0</option>
                    <option class="option" value="1.1">重要1.1</option>
                </select>
                <span>结构重要性系数</span>
            </label>

            <label>
                <input type="number" id="d" name="d" placeholder="800">
                <span>钢管外径(mm)</span>
            </label>
            <label>
                <input type="number" id="t" name="t" placeholder="20">
                <span>钢管厚度(mm)</span>
            </label>
            <label>
                <input type="number" id="l" name="l" placeholder="10000">
                <span>钢管长度(mm)</span>
            </label>
            <label>
                <input type="number" id="μ" name="μ" placeholder="1">
                <span>计算长度系数</span>
            </label>
            <label>
                <input type="radio " id="kn" name="kn" value="0.967">
                <span>无侧移框架柱、轴心受压柱、杆件</span>
                <input type="radio" id="kh" name="kh" value="1">
                <span>有侧移框架柱</span>
            </label>
            <label>
                <select name="fc" id="fc">
                    <option value="">请选择:</option>
                    <option value="7.2">C15</option>
                    <option value="9.6">C20</option>
                    <option value="11.9">C25</option>
                    <option value="14.3">C30</option>
                    <option value="16.7">C35</option>
                    <option value="19.1">C40</option>
                    <option value="21.1">C45</option>
                    <option value="23.1">C50</option>
                    <option value="25.3">C55</option>
                    <option value="27.5">C60</option>
                    <option value="29.7">C65</option>
                    <option value="31.8">C70</option>
                    <option value="33.8">C75</option>
                    <option value="35.9">C80</option>
                </select>
                <span>混凝土轴心抗压强度设计值(N/mm²)</span>
            </label>
            <label>
                <input type="number" id="fa" name="fa" placeholder="215">
                <span>钢材抗压强度设计值(N/mm²)</span>
            </label>
            <label>
                <input type="radio " id="rn" name="rn" value="0.967">
                <span>无人防荷载</span>
                <input type="radio" id="rh" name="rh" value="1">
                <span>有人防荷载</span>
            </label>
            <label>
                <input type="number" id="N" name="N" placeholder="16000">
                <span>轴向压力设计值(KN)</span>
            </label>
            <label>
                <input type="number" id="M1" name="M1" placeholder="320">
                <span>柱顶弯设计值(KN·m)</span>
            </label>
            <label>
                <input type="number" id="M2" name="M2" placeholder="320">
                <span>柱底弯设计值(KN·m)</span>
            </label>
            <button id="btnE2" type="button">计算</button>
        </form>
    </body>

</html>
