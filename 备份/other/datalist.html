<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>钢围檩型号</title>
        <link rel="stylesheet" href="../css/datalist.css">
    </head>

    <body>
        <form>
            <label for="choose">
                <select id="choose">
                    <option value="200">20a</option>
                    <option value="200">20b</option>
                    <option value="220">22a</option>
                    <option value="220">22b</option>
                    <option value="250">25a</option>
                    <option value="250">25b</option>
                    <option value="280">28a</option>
                    <option value="280">28b</option>
                    <option value="320">32a</option>
                    <option value="320">32b</option>
                    <option value="320">32c</option>
                    <option value="360">36a</option>
                    <option value="360">36b</option>
                    <option value="360">36c</option>
                    <option value="400">40a</option>
                    <option value="400">40b</option>
                    <option value="400">40c</option>
                    <option value="450">45a</option>
                    <option value="450">45b</option>
                    <option value="450">45c</option>
                    <option value="500">50a</option>
                    <option value="500">50b</option>
                    <option value="500">50c</option>
                </select>钢围檩型号
            </label><br>
            <fieldset>
                <legend>工字钢</legend>
                <label><input type="number" id="h" readonly placeholder="0">截面高度(mm)</label><br>
                <label><input type="number" id="t1" readonly placeholder="0">腹板厚度(mm)</label><br>
                <label><input type="number" id="A" readonly placeholder="0">截面面积(cm²)</label><br>
                <label><input type="number" id="Ix" readonly placeholder="0">惯性矩(cm<sup>4</sup>)</label><br>
                <label><input type="number" id="Sx" readonly placeholder="0">半截面面积矩(cm³)</label><br>
                <label><input type="number" id="q" readonly placeholder="0">质量(Kg/m)</label><br>
                <label><input type="number" id="ixsx" readonly placeholder="0">Ix/Sx</label><br>
            </fieldset>
            <fieldset>
                <legend>连续缀板</legend>
                <label><input type="number" id="lh" placeholder="700">连续缀板宽度(mm)</label><br>
                <label><input type="number" id="lt" placeholder="12">连续缀板厚度(mm)</label><br>
                <label><input type="number" id="lA" readonly placeholder="100">连续缀板截面面积(cm²)</label><br>
                <label><input type="number" id="lIx" readonly placeholder="1000">连续缀板惯性矩(cm)<sup>4</sup></label><br>
            </fieldset>
            <fieldset>
                <legend>缀板</legend>
                <label><input type="number" id="ph" placeholder="100">缀板高度(mm)</label><br>
                <label><input type="number" id="pt" placeholder="12">缀板厚度(mm)</label><br>
                <label><input type="number" id="pA" readonly placeholder="100">缀板截面面积(cm²)</label><br>
                <label><input type="number" id="pIx" readonly placeholder="1000">缀板惯性矩(cm<sup>4</sup>)</label><br>l
            </fieldset>
            <fieldset>
                <legend>组合截面(考虑两侧缀板作用)</legend>
                <label><input type="number" id="ms" placeholder="2">工字钢数量(个)</label><br>
                <label><input type="number" id="mm" placeholder="108">弯矩设计值(KN-m)</label><br>
                <label><input type="number" id="mf" placeholder="216">剪力设计值(KN)</label><br>
            </fieldset>
            <fieldset>
                <legend>组合截面(只考虑连续缀板作用)</legend>
                <label><input type="number" id="ns" placeholder="2">工字钢数量(个)</label><br>
                <label><input type="number" id="nm" placeholder="108">弯矩设计值(KN-m)</label><br>
                <label><input type="number" id="nf" placeholder="216">剪力设计值(KN)</label><br>
            </fieldset>
            <button id="submitB2" type="button">计算</button>
        </form>

                    const { h, t1, A, Ix, Sx, q, ixsx } = specs[index];
                    document.getElementById('h').value = h;

                    document.getElementById('Sx').value = Sx;

                    document.getElementById('ixsx').value = ixsx;
                };
                choose.addEventListener('change', updateValues);
                // 初始化时调用一次，以填充默认值
                updateValues();

        </script>
    </body>

</html>
