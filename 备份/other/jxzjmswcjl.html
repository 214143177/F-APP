<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <level>Document</level>
    </head>

    <body>
        <form id="formE1" class="form">
            <h1>矩形正截面受弯承载力计算</h1>

            <label><span>结构重要性系数</span></label>
            <select id="r0" name="r0">
                <option class="option" value="">请选择:</option>
                <option class="option" value="0.9">普通0.9</option>
                <option class="option" value="1.0">一般1.0</option>
                <option class="option" value="1.1">重要1.1</option>
            </select>

            <label><span>弯矩设计值(KN·m)</span></label>
            <input type="number" id="M" name="M" placeholder="1000">

            <label><span>矩形宽度(mm)</span></label>
            <input type="number" id="b" name="b" placeholder="1000">

            <label><span>矩形高度(mm)</span></label>
            <input type="number" id="h" name="h" placeholder="800">

            <label><span>主筋直径(mm)</span></label>
            <input type="number" id="D" name="D" placeholder="25">

            <label><span>箍筋直径(mm)</span></label>
            <input type="number" id="d" name="d" placeholder="14">

            <label><span>最外层净保护层厚度(mm)</span></label>
            <input type="number" id="c" name="c" placeholder="40">

            <label><span>混凝土轴心抗压强度设计值(N/mm²)</span></label>
            <select name="fc" id="fc">
                <option value="">请选择:</option>
                <option value="7.2">C15</option>
                <option value="9.6">C20</option>
                <option value="11.9">C25</option>
                <option value="14.3">C30</option>
                <option value="16.7">C35</option>
                <option value="19.1">C40</option>
                <option value="21.1">C45</option>
                <option value="23.1">C50</option>
                <option value="25.3">C55</option>
                <option value="27.5">C60</option>
                <option value="29.7">C65</option>
                <option value="31.8">C70</option>
                <option value="33.8">C75</option>
                <option value="35.9">C80</option>
            </select>
            <label><span>混凝土弹性模量(N/mm²)</span></label>
            <select name="Ec" id="Ec">
                <option value="">请选择:</option>
                <option value="22000">C15</option>
                <option value="25500">C20</option>
                <option value="28000">C25</option>
                <option value="30000">C30</option>
                <option value="31500">C35</option>
                <option value="32500">C40</option>
                <option value="33500">C45</option>
                <option value="34500">C50</option>
                <option value="35500">C55</option>
                <option value="36000">C60</option>
                <option value="36500">C65</option>
                <option value="37000">C70</option>
                <option value="37500">C75</option>
                <option value="38000">C80</option>
            </select>
            <label><span>钢筋弹性模量(N/mm²)</span></label>
            <select name="Es" id="Es">
                <option value="">请选择:</option>
                <option value="210000">HPB300</option>
                <option value="200000">HRB335</option>
                <option value="200000">HRB400</option>
                <option value="200000">HRBF400</option>
                <option value="200000">RRB400</option>
                <option value="200000">HRB500</option>
                <option value="200000">HRBF500</option>
                <option value="205000">消除应力钢丝</option>
                <option value="205000">中强度预应力钢丝</option>
                <option value="195000">钢绞线</option>
            </select>
            <label><span>钢筋抗拉强度设计值(N/mm²)</span></label>
            <select name="fy" id="fy">
                <option value="">请选择:</option>
                <option value="270">HPB300</option>
                <option value="300">HRB335</option>
                <option value="360">HRB400</option>
                <option value="360">HRBF400</option>
                <option value="360">RRB400</option>
                <option value="435">HRB500</option>
                <option value="435">HRBF500</option>
            </select>
            <label><span>钢筋抗压强度设计值(N/mm²)</span></label>
            <select name="fyi" id="fyi">
                <option value="">请选择:</option>
                <option value="270">HPB300</option>
                <option value="300">HRB335</option>
                <option value="360">HRB400</option>
                <option value="360">HRBF400</option>
                <option value="360">RRB400</option>
                <option value="435">HRB500</option>
                <option value="435">HRBF500</option>
            </select>

        </form>


    </body>

</html>
