<form id="formD1" class="form">
    <h1>超前深孔注浆加固</h1>
    <div class="form-group">
        <label for="volume1">加固土体体积(m³)</label>
        <input type="number" id="volume1" name="volume1" placeholder="200" required>
    </div>
    <div class="form-group">
        <label for="Slurry1">浆液单价(元/m³)</label>
        <input type="number" id="Slurry1" name="Slurry1" placeholder="820" required>
    </div>
    <div class="form-group">
        <label for="porosity1">土体孔隙率</label>
        <input type="number" id="porosity1" name="porosity1" placeholder="0.8" required>
    </div>
    <div class="form-group">
        <label for="filling1">填充系数</label>
        <input type="number" id="filling1" name="filling1" placeholder="0.3" required>
    </div>
    <div class="form-group">
        <label for="loss1">损耗率</label>
        <input type="number" id="loss1" name="loss1" placeholder="1.15" required>
    </div>
    <div class="form-group">
        <div class="description">
            <p>1、建议暗挖断面拱顶120º~150º范围内、初支内0.5m、初支外1.5m。注浆浆液采用单液浆。</p>
            <p>2、建议深孔注浆的初压为0.7~1.0MPa,终压为为1.5MPa,注浆后土体无侧限抗压强度不低于0.5MPa,渗透系数不大于1X10<sup>-7</sup>cm/s。</p>
        </div>
    </div>
    <button id="btnD1" type="button" onclick="calcD1('formD1')">计算</button>
</form>
